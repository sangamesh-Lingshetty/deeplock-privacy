<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Hard Mode Active</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at top, rgba(239,68,68,.14), transparent 36%),
          #070708;
        color: #f8fafc;
        font-family: "DM Sans", sans-serif;
        padding: 24px;
      }
      .card {
        width: min(560px, 100%);
        background: rgba(15, 16, 19, .96);
        border: 1px solid rgba(239,68,68,.18);
        border-radius: 24px;
        padding: 34px;
        text-align: center;
      }
      .eyebrow {
        font: 700 10px "Space Mono", monospace;
        color: #f87171;
        letter-spacing: 2px;
        margin-bottom: 18px;
      }
      h1 {
        font: 700 34px "Space Mono", monospace;
        margin-bottom: 12px;
      }
      .body {
        color: #94a3b8;
        line-height: 1.8;
        margin-bottom: 24px;
      }
      .timer {
        display: inline-block;
        font: 700 42px "Space Mono", monospace;
        color: #f87171;
        background: rgba(239,68,68,.08);
        border: 1px solid rgba(239,68,68,.18);
        border-radius: 18px;
        padding: 14px 22px;
        margin-bottom: 18px;
      }
      .lock-note {
        font-size: 13px;
        color: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="eyebrow">HARD MODE ACTIVE</div>
      <h1>Hard Mode Active 🔒</h1>
      <div class="body">
        This session is protected. You cannot disable the system, remove blocked
        sites, or back out now. Finish what you started.
      </div>
      <div class="timer" id="hardModeTimer">--:--</div>
      <div class="lock-note">No exit option. Remaining time only.</div>
    </div>
    <script src="hardmode.js"></script>
  </body>
</html>
