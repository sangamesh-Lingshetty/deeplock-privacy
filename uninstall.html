<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Before You Go</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0d12;
        color: #f8fafc;
        font-family: "DM Sans", sans-serif;
        padding: 24px;
      }
      .card {
        width: min(640px, 100%);
        background: #131722;
        border: 1px solid rgba(255,255,255,.08);
        border-radius: 24px;
        padding: 32px;
      }
      h1 { font: 700 32px "Space Mono", monospace; margin-bottom: 10px; }
      .sub { color: #94a3b8; margin-bottom: 20px; line-height: 1.7; }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 20px;
      }
      .stat {
        border: 1px solid rgba(255,255,255,.06);
        border-radius: 16px;
        padding: 16px;
        background: rgba(255,255,255,.03);
      }
      .label { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
      .value { font: 700 22px "Space Mono", monospace; }
      .question { font-size: 14px; margin-bottom: 10px; }
      textarea {
        width: 100%;
        min-height: 110px;
        background: #0b0d12;
        color: #f8fafc;
        border: 1px solid rgba(255,255,255,.08);
        border-radius: 16px;
        padding: 14px;
        font: 14px "DM Sans", sans-serif;
      }
      .offer {
        margin-top: 18px;
        padding: 14px 16px;
        border-radius: 16px;
        background: rgba(59,130,246,.08);
        border: 1px solid rgba(59,130,246,.16);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Before you go...</h1>
      <div class="sub">You already built real momentum. If something broke your trust, tell us.</div>
      <div class="stats">
        <div class="stat">
          <div class="label">Focus Time</div>
          <div class="value" id="uninstallFocus">0h</div>
        </div>
        <div class="stat">
          <div class="label">Current Streak</div>
          <div class="value" id="uninstallStreak">0d</div>
        </div>
        <div class="stat">
          <div class="label">Sessions</div>
          <div class="value" id="uninstallSessions">0</div>
        </div>
      </div>
      <div class="question">What made you leave?</div>
      <textarea placeholder="Too strict? Missing something? Technical issue?"></textarea>
      <div class="offer">Stay with DeepLock Pro and keep your streak alive. Offer: 20% off your first year.</div>
    </div>
    <script src="uninstall.js"></script>
  </body>
</html>
